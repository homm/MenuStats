<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1254 1254" fill="none">
  <defs>
    <linearGradient id="tileFill" x1="627" y1="40" x2="627" y2="1215" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10284d"/>
      <stop offset="0.42" stop-color="#061b38"/>
      <stop offset="1" stop-color="#061629"/>
    </linearGradient>
    <radialGradient id="tileLight" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(640 430) rotate(90) scale(735 700)">
      <stop offset="0" stop-color="#173a70" stop-opacity="0.48"/>
      <stop offset="0.55" stop-color="#0a2448" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimShine" x1="220" y1="150" x2="1040" y2="1120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.62"/>
      <stop offset="0.28" stop-color="#79DFFF" stop-opacity="0.28"/>
      <stop offset="0.58" stop-color="#1B4B87" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#000814" stop-opacity="0.64"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="130" y1="365" x2="1123" y2="365" gradientUnits="userSpaceOnUse">
      <stop stop-color="#47F468"/>
      <stop offset="0.54" stop-color="#54FF63"/>
      <stop offset="1" stop-color="#47F468"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="130" y1="515" x2="1122" y2="515" gradientUnits="userSpaceOnUse">
      <stop stop-color="#20C8FF"/>
      <stop offset="0.52" stop-color="#18C2FF"/>
      <stop offset="1" stop-color="#22C5FF"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="130" y1="609" x2="1122" y2="609" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFB11A"/>
      <stop offset="0.5" stop-color="#FF970E"/>
      <stop offset="1" stop-color="#FFB11A"/>
    </linearGradient>
    <linearGradient id="arcGrad" x1="306" y1="933" x2="948" y2="708" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2364FF"/>
      <stop offset="0.43" stop-color="#2F87FF"/>
      <stop offset="0.73" stop-color="#1EDFE8"/>
      <stop offset="1" stop-color="#19C5F6"/>
    </linearGradient>
    <radialGradient id="gaugeFill" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(625 930) rotate(90) scale(330 315)">
      <stop offset="0" stop-color="#132E59"/>
      <stop offset="0.6" stop-color="#092043"/>
      <stop offset="1" stop-color="#06152E"/>
    </radialGradient>
    <linearGradient id="needleGrad" x1="620" y1="945" x2="832" y2="735" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D7DFED"/>
      <stop offset="0.46" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F2F5FA"/>
    </linearGradient>
    <radialGradient id="hubGrad" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(610 941) rotate(90) scale(45)">
      <stop stop-color="#F8FAFF"/>
      <stop offset="0.62" stop-color="#DCE5F1"/>
      <stop offset="1" stop-color="#BFCADA"/>
    </radialGradient>
    <filter id="softGlow" x="-35%" y="-35%" width="170%" height="170%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="innerDark" x="-10%" y="-10%" width="120%" height="120%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="24" stdDeviation="26" flood-color="#000814" flood-opacity="0.45"/>
    </filter>
    <filter id="tileShadow" x="-8%" y="-8%" width="116%" height="116%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000814" flood-opacity="0.52"/>
    </filter>
    <clipPath id="tileClip">
      <rect x="127" y="127" width="999" height="999" rx="211"/>
    </clipPath>
  </defs>

  <!-- transparent canvas; the rounded app tile is the only opaque background -->
  <rect x="127" y="127" width="999" height="999" rx="211" fill="url(#tileFill)" filter="url(#tileShadow)"/>
  <rect x="127" y="127" width="999" height="999" rx="211" fill="url(#tileLight)"/>
  <rect x="136" y="136" width="981" height="981" rx="202" stroke="#122E58" stroke-width="3" opacity="0.68"/>

  <!-- grid -->
  <g opacity="0.49" stroke="#173763" stroke-width="5" stroke-linecap="round">
    <path d="M147 280H1106"/>
    <path d="M137 411H1116"/>
    <path d="M136 546H1118"/>
    <path d="M137 681H1117"/>
    <path d="M137 806H1116"/>
    <path d="M216 244V1007"/>
    <path d="M426 219V1024"/>
    <path d="M626 218V1074"/>
    <path d="M816 220V1020"/>
    <path d="M1034 218V999"/>
  </g>

  <!-- data lines -->
  <g stroke-linejoin="round" stroke-linecap="round">
    <path d="M136 341 L183 341 L209 384 L293 384 L316 356 L363 356 L386 280 L488 280 L516 321 L555 321 L586 183 L692 183 L743 356 L790 356 L812 378 L841 378 L870 305 L920 305 L947 376 L994 376 L1019 340 L1118 340" stroke="url(#greenGrad)" stroke-width="16" transform="translate(0 55)"/>
    <path d="M136 476 L184 476 L205 539 L232 520 L264 537 L296 537 L318 495 L359 517 L383 494 L409 517 L443 489 L467 538 L493 529 L526 543 L562 543 L565 377 L595 497 L623 458 L651 552 L711 552 L735 522 L761 541 L827 541 L851 493 L874 529 L899 516 L930 530 L972 530 L996 492 L1016 533 L1052 532 L1080 451 L1117 451" stroke="url(#cyanGrad)" stroke-width="16" transform="translate(0 75)"/>
    <path d="M136 593 L179 593 L207 619 L291 619 L330 587 L356 604 L381 596 L407 616 L431 615 L453 584 L489 615 L515 603 L548 620 L584 614 L620 632 L657 632 L692 633 L719 598 L747 598 L775 619 L837 619 L860 598 L889 609 L925 581 L965 596 L991 597 L1020 616 L1052 603 L1085 622 L1115 582" stroke="url(#orangeGrad)" stroke-width="16" transform="translate(0 90)"/>
  </g>

  <g clip-path="url(#tileClip)">
    <g transform="translate(0 -35)">
      <!-- gauge -->
      <g filter="url(#innerDark)">
        <circle cx="627" cy="1120" r="250" fill="#06152E"/>
        <circle cx="627" cy="1120" r="250" stroke="url(#arcGrad)" stroke-width="26"/>
        <circle cx="627" cy="1120" r="222" fill="url(#gaugeFill)"/>
      </g>

      <!-- tick marks -->
      <g stroke-linecap="round" stroke-width="8">
        <path d="M437 1230 L461 1216" stroke="#91A8E9"/>
        <path d="M407 1120 L435 1120" stroke="#91A8E9"/>
        <path d="M437 1010 L461 1024" stroke="#91A8E9"/>
        <path d="M517 930 L531 954" stroke="#B7C6F4"/>
        <path d="M627 900 L627 928" stroke="#B7C6F4"/>
        <path d="M737 930 L723 954" stroke="#28D9EA"/>
        <path d="M817 1010 L793 1024" stroke="#24D0EE"/>
        <path d="M847 1120 L819 1120" stroke="#20CBEF"/>
        <path d="M817 1230 L793 1216" stroke="#20CBEF"/>
      </g>

      <!-- needle and hub -->
      <g filter="url(#softGlow)">
        <path d="M616 1108 C646 1072 688 1032 717 1005 C725 998 734 1007 727 1016 C699 1048 661 1087 638 1129 Z" fill="url(#needleGrad)"/>
        <circle cx="627" cy="1120" r="29" fill="url(#hubGrad)"/>
        <circle cx="627" cy="1120" r="23" fill="#E8EEF8" opacity="0.83"/>
        <circle cx="627" cy="1120" r="29" stroke="#FFFFFF" stroke-width="4" opacity="0.75"/>
      </g>
    </g>
  </g>

  <!-- rim -->
  <rect x="128.5" y="128.5" width="996" height="996" rx="209.5" stroke="#FFFFFF" stroke-width="4" opacity="0.22"/>
  <rect x="131" y="131" width="991" height="991" rx="207" stroke="url(#rimShine)" stroke-width="8" opacity="0.95"/>
</svg>
